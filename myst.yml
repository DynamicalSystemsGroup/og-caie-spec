version: 1
project:
  title: OG-CAIE as an executable specification
  description: >
    Ontology-Grounded Contextual AI Evaluation: the process, its vocabulary
    grounded in ISO, IEEE and NIST canon, the human and machine assemblage
    that runs it, and one evaluation record whose conformance is checked by
    machine and whose judgments are attested by named people.
  authors:
    - name: Michael Zargham
      orcid: 0000-0001-5279-690X
      affiliations:
        - Dynamical Systems Group
    - name: Julie Hollek
      orcid: 0000-0003-1455-8542
      affiliations:
        - Humane Intelligence
  license: CC-BY-SA-4.0
  exclude:
    - README.md
    - CLAUDE.md
    - LICENSE.md
    - sources/digests/*.md
    - rulings/sheets/*.md
  numbering:
    headings: true
  abbreviations:
    OG-CAIE: Ontology-Grounded Contextual AI Evaluation
    CAIE: Contextual AI Evaluation
    DSO: Domain-Specific Ontology
    EPO: Evaluation Process Ontology
    SEVOCAB: Software and Systems Engineering Vocabulary (IEEE Computer Society)
    RDF: Resource Description Framework
    SKOS: Simple Knowledge Organization System
    PROV: Provenance Ontology (PROV-O)
    EARL: Evaluation and Report Language
    SHACL: Shapes Constraint Language
    SPARQL: SPARQL Protocol and RDF Query Language
  bibliography:
    - references.bib
  error_rules:
    - rule: doi-exists
      severity: ignore
  toc:
    - file: index.md
    - file: docs/glossary.md
    - file: docs/contracting.md
    - file: docs/evaluation.md
    - file: docs/model.md
    - file: docs/guarantees.md
    - file: docs/conclusion.md
    - file: docs/appendix-explorer.md
    - title: "Appendix B: computational proofs"
      children:
        - file: notebooks/checked-contracting.ipynb
        - file: notebooks/checked-evaluation.ipynb
        - file: notebooks/checked-model.ipynb
        - file: notebooks/checked-guarantees.ipynb
    - file: docs/rulings.md
    - file: docs/appendix-toolchain.md
site:
  template: book-theme
